name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.9', '3.11', '3.12']
        detectlib: [true]
        include:
          - os: windows-latest
            python-version: '3.11'
            detectlib: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (with charset-normalizer)
        if: matrix.detectlib
        run: pip install -r skills/file-encoding/requirements.txt
      - name: Verify no charset-normalizer/chardet (heuristic-only mode)
        if: "!matrix.detectlib"
        shell: bash
        run: |
          python - <<'PYEOF'
          import importlib.util
          for m in ('charset_normalizer', 'chardet'):
              if importlib.util.find_spec(m):
                  raise SystemExit(m + ' should not be installed')
          print('OK: no detection library installed')
          PYEOF
      - name: Run tests
        working-directory: skills/file-encoding/scripts
        run: python -m unittest discover -s . -p "test_*.py" -v
